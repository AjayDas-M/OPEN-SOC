<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Platform - Login</title>
    <link rel="icon" type="image/x-icon" href="logo.jpg">
    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #121212;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full viewport height */
            overflow: hidden; /* Hide scroll */
        }

        /* Login Container */
        .login-container {
            background: #1a1a1a;
            border: 2px solid #4CAF50; /* Green border like logs page */
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.6); /* Green glow */
            text-align: center;
            width: 100%;
            max-width: 450px; /* Control form width */
        }

        h1 {
            margin: 0 0 20px;
            font-size: 2.5em;
            color: #4CAF50; /* Match header color */
        }

        p {
            margin-bottom: 30px;
            color: #ddd;
        }

        /* Input Styling */
        .input-field {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #4CAF50;
            border-radius: 8px;
            background: #121212;
            color: #f5f5f5;
            font-size: 1em;
        }

        .input-field:focus {
            outline: none;
            border-color: #66ff99; /* Light green on focus */
        }

        /* Password Container */
        .password-container {
            position: relative;
            width: 100%;
            margin: 10px 0;
        }

        .toggle-password {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
        }

        /* Login Button */
        .btn {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #45a049; /* Slightly darker on hover */
        }

        /* Error Message */
        .error {
            color: #FF6347; /* Tomato red for errors */
            margin-top: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: #888;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .login-container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .btn {
                font-size: 1em;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>Open Source SOC Platform</h1>
        <p>Secure Access - Login Required</p>

        <!-- Login Form -->
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" class="input-field" required>

            <!-- Password with Toggle -->
            <div class="password-container">
                <input type="password" name="password" id="password" placeholder="Password" class="input-field" required>
                <span class="toggle-password" onclick="togglePassword()">🔒</span>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <!-- Error Message Display -->
        {% if error %}
        <div class="error" id="errorMessage">{{ error }}</div>
        {% endif %}
    </div>

    <footer>
        &copy; 2025 Open Source SOC Platform | Secure Across All Platforms
    </footer>

    <!-- Password Toggle and Clear Error Script -->
    <script>
// Disable Forward and Backward Navigation
window.onload = function () {
    // Continuously monitor the history state to prevent navigation
    setTimeout(function () {
        history.pushState(null, null, location.href);
    }, 0);

    window.addEventListener('popstate', function () {
        history.pushState(null, null, location.href);
    });

    // Periodically enforce the lock
    setInterval(() => {
        history.pushState(null, null, location.href);
    }, 100);

    // Clear Error Message on Page Load
    const errorMessage = document.getElementById('errorMessage');
    if (errorMessage) {
        setTimeout(() => errorMessage.style.display = 'none', 5000); // Hide error after 5 seconds
    }
};

// Toggle Password Visibility
function togglePassword() {
    const passwordField = document.getElementById('password');
    const toggleIcon = document.querySelector('.toggle-password');
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleIcon.textContent = '🔓'; // Open lock when visible
    } else {
        passwordField.type = 'password';
        toggleIcon.textContent = '🔒'; // Closed lock when hidden
    }
}
    </script>

</body>

</html>
